name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run mypy src/reconcheck
      - run: uv run pytest
      - run: uv run reconcheck --version

  frontend-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: diff -qr frontend/dist src/reconcheck/static
      - run: uv build
      - run: uvx twine check dist/*
